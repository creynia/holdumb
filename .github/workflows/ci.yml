name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Lets visual-baselines.yml re-run CI on the commit it pushes (GITHUB_TOKEN pushes trigger nothing).
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm run build:all
      # After the build, so the single-file and SW tests see real output.
      - run: npm test
      - uses: actions/upload-artifact@v4
        with:
          name: holdumb-html
          path: dist-single/holdumb.html
      # e2e and visual serve this build instead of rebuilding it (I043).
      - uses: actions/upload-artifact@v4
        with:
          name: build
          path: |
            dist
            dist-single
          retention-days: 3
          if-no-files-found: error

  e2e:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: build
      # Chromium is cached per @playwright/test version; only a cache miss downloads it.
      - id: pw-version
        run: echo "v=$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version")" >> "$GITHUB_OUTPUT"
      - id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-chromium-${{ runner.os }}-${{ steps.pw-version.outputs.v }}
      - if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      # On a warm cache the browser is there, but the runner still needs its system libraries.
      - if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - run: npm run test:e2e
        env:
          PREBUILT: '1'
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report

  # Lighthouse budgets for the Pages build (I077): mobile emulation (Moto G Power, 4x CPU) on #/,
  # #/play and #/learn/a-full-hand. Serves the check job's build artifact (no rebuild, I043).
  # Not a required check yet: make it required after two green weeks.
  lighthouse:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Lighthouse 11 still has the PWA category and the installable-manifest audit (12 removed them).
      LHCI: '@lhci/cli@0.13.0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: build
      - name: Lighthouse (collect)
        run: npx --yes "$LHCI" collect
      - name: Lighthouse (reports)
        if: always()
        run: |
          npx --yes "$LHCI" upload --target=filesystem --outputDir=lhci-report || true
          npx --yes "$LHCI" upload --target=temporary-public-storage || true
          node scripts/lhci-summary.mjs >> "$GITHUB_STEP_SUMMARY"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse
          path: lhci-report
          retention-days: 14
      - name: Lighthouse (budgets)
        run: npx --yes "$LHCI" assert

  # Screenshot comparison at 4 viewports x light/dark (playwright.visual.config.ts). Runs in the
  # Playwright image that matches @playwright/test 1.56.1, so fonts and rasterisation are the same
  # as when the baselines were generated. Baselines: tests/visual/__screenshots__/.
  visual:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    permissions:
      contents: read
      pull-requests: write # the sticky comment only
    env:
      CI: '1'
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Node in the image matches .nvmrc
        run: |
          want=$(cut -d. -f1 < .nvmrc | tr -d 'v ')
          have=$(node -p 'process.versions.node.split(".")[0]')
          echo "node $(node --version), .nvmrc major $want"
          [ "$have" = "$want" ] || { echo "::error::container node $have != .nvmrc $want"; exit 1; }
      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: visual-npm-${{ hashFiles('package-lock.json') }}
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: build
      - run: npx playwright test -c playwright.visual.config.ts
        env:
          PREBUILT: '1'
      - if: failure()
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: visual-diff
          path: |
            playwright-report
            test-results
            visual-report.json
          retention-days: 14
      - if: failure()
        run: node scripts/visual-summary.mjs visual-report.json "${{ steps.upload.outputs.artifact-url }}" | tee visual-summary.md >> "$GITHUB_STEP_SUMMARY"
      - if: failure() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- holdumb-visual-diff -->';
            const body = `${marker}\n${fs.readFileSync('visual-summary.md', 'utf8')}`;
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const mine = comments.find((c) => c.body?.startsWith(marker));
            if (mine) await github.rest.issues.updateComment({ owner, repo, comment_id: mine.id, body });
            else await github.rest.issues.createComment({ owner, repo, issue_number, body });
      # A later green run updates the sticky comment (if one exists) so it never shows a stale failure.
      - if: success() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- holdumb-visual-diff -->';
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const mine = comments.find((c) => c.body?.startsWith(marker));
            const body = `${marker}\n### Visual comparison\n\nAll snapshots match (${context.payload.pull_request.head.sha.slice(0, 7)}).`;
            if (mine) await github.rest.issues.updateComment({ owner, repo, comment_id: mine.id, body });
